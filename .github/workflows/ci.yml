name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:vognary_ci@127.0.0.1:5432/vognary_ci
      POSTGRES_SSL: "false"
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef01234567
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: vognary_ci
          POSTGRES_DB: vognary_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vognary_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Verify runtime contract
        run: test "$(node --version)" = "v22.23.2" && test "$(npm --version)" = "10.9.8"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run ci:database
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run claims:check
      - run: npm run research:check
      - run: npm run brand:check
      - run: npm run tokens:check
      - run: npm test
      - run: npm run corpus
      - run: npm run build
      - run: npm run perf:budget
      - run: npx playwright install --with-deps chromium
      - name: Enforce Lighthouse budgets
        run: CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run perf:lighthouse
      - run: npm run test:e2e
      - name: Start dev server for signed-in e2e (development login)
        env:
          ENABLE_DEVELOPMENT_LOGIN: "true"
          DEVELOPMENT_LOGIN_EMAIL: founder@vognary.test
          DEVELOPMENT_LOGIN_ACCESS_CODE: ci-dev-login-code
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef01234567
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ALLOW_IN_MEMORY_RATE_LIMITS: "true"
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3005 > /tmp/vognary-dev.log 2>&1 &
          echo $! > /tmp/vognary-dev.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3005/api/health > /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3005/api/health > /dev/null || { cat /tmp/vognary-dev.log; exit 1; }
          curl -fsS http://127.0.0.1:3005/login > /dev/null
          curl -fsS http://127.0.0.1:3005/app > /dev/null
          curl -fsS http://127.0.0.1:3005/sources > /dev/null
      - name: Signed-in e2e journeys (development login)
        env:
          VOGNARY_E2E_DEV_LOGIN_EMAIL: founder@vognary.test
          VOGNARY_E2E_DEV_LOGIN_CODE: ci-dev-login-code
          PLAYWRIGHT_EXTERNAL_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3005
        # Recovery v1 is the canonical signed launch path. Customer #0 performs
        # the real database-backed desktop/mobile lifecycle; the two UI suites
        # retain focused presentation/state coverage around that core proof.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          npm run db:apply-schema
          npm run test:e2e -- recovery-customer-zero recovery-ui-home recovery-ui-states
      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/vognary-dev.pid ]; then kill "$(cat /tmp/vognary-dev.pid)" || true; fi
      - name: Start production server
        run: |
          ALLOW_IN_MEMORY_RATE_LIMITS=true INTERNAL_SYNC_SECRET=ci-internal-sync-secret PORT=3000 npm run start > /tmp/vognary.log 2>&1 &
          echo $! > /tmp/vognary.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 1
          done
          cat /tmp/vognary.log
          exit 1
      - run: npm run smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_INTERNAL_SECRET: ci-internal-sync-secret
          SMOKE_ALLOW_UNCONFIGURED: "true"
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/vognary.pid ]; then kill "$(cat /tmp/vognary.pid)" || true; fi
