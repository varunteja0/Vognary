name: Production database activation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect production, apply the canonical Phase A chain, or migrate legacy Recovery data
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply-latest
          - apply-control-0057
          - migrate-legacy
      confirmation:
        description: Enter INSPECT_PRODUCTION, APPLY_LATEST_PRODUCTION, APPLY_CONTROL_0057_PRODUCTION, or MIGRATE_LEGACY_PRODUCTION
        required: true
        type: string
      backup_run_id:
        description: Successful Encrypted Backup Drill run ID; pre-0053 for apply-latest, pre-0057 for apply-control-0057
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      POSTGRES_SSL: "true"
      POSTGRES_SSL_REJECT_UNAUTHORIZED: "false"
    steps:
      - name: Validate operator confirmation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          expected=INSPECT_PRODUCTION
          if [ "$OPERATION" = "apply-latest" ]; then
            expected=APPLY_LATEST_PRODUCTION
          fi
          if [ "$OPERATION" = "apply-control-0057" ]; then
            expected=APPLY_CONTROL_0057_PRODUCTION
          fi
          if [ "$OPERATION" = "migrate-legacy" ]; then
            expected=MIGRATE_LEGACY_PRODUCTION
          fi
          if [ "$CONFIRMATION" != "$expected" ]; then
            echo "Confirmation does not match the selected operation." >&2
            exit 1
          fi
          if { [ "$OPERATION" = "apply-latest" ] || [ "$OPERATION" = "apply-control-0057" ]; } && ! [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "$OPERATION requires a numeric backup_run_id." >&2
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm ci

      - name: Verify the pre-migration encrypted backup and restore drill
        if: inputs.operation == 'apply-latest' || inputs.operation == 'apply-control-0057'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          CURRENT_SHA: ${{ github.sha }}
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const runId = process.env.BACKUP_RUN_ID;
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const currentSha = process.env.CURRENT_SHA;
          const artifactName = process.env.OPERATION === "apply-control-0057"
            ? "encrypted-postgres-backup-pre-0057"
            : "encrypted-postgres-backup-pre-0053";
          async function github(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "x-github-api-version": "2022-11-28",
              },
            });
            if (!response.ok) throw new Error(`GitHub API ${path} failed with HTTP ${response.status}.`);
            return response.json();
          }
          const run = await github(`/actions/runs/${encodeURIComponent(runId)}`);
          const ageMs = Date.now() - Date.parse(run.updated_at);
          if (run.name !== "Encrypted Backup Drill"
            || run.event !== "workflow_dispatch"
            || run.head_branch !== "main"
            || run.head_sha !== currentSha
            || run.conclusion !== "success"
            || !Number.isFinite(ageMs)
            || ageMs < 0
            || ageMs > 24 * 60 * 60 * 1000) {
            throw new Error("The supplied backup run is not a successful main-branch drill from the last 24 hours.");
          }
          const artifacts = await github(`/actions/runs/${encodeURIComponent(runId)}/artifacts`);
          const backup = (artifacts.artifacts ?? []).find((artifact) => (
            artifact.name === artifactName
              && artifact.expired === false
              && Number(artifact.size_in_bytes) > 0
          ));
          if (!backup) throw new Error(`The backup run has no unexpired ${artifactName} artifact.`);
          console.log(`Verified ${artifactName} from Actions run ${runId}.`);
          NODE

      - name: Resolve the production database without exposing credentials
        run: |
          node <<'NODE'
          const { appendFileSync } = await import("node:fs");

          const apiKey = process.env.NEON_API_KEY;
          const projectId = process.env.NEON_PROJECT_ID;
          if (!apiKey || !projectId) throw new Error("NEON_API_KEY and NEON_PROJECT_ID must be configured in GitHub.");

          const base = `https://console.neon.tech/api/v2/projects/${encodeURIComponent(projectId)}`;
          async function request(path) {
            const response = await fetch(`${base}${path}`, {
              headers: { accept: "application/json", authorization: `Bearer ${apiKey}` },
            });
            if (!response.ok) throw new Error(`Neon API request failed with HTTP ${response.status}.`);
            return response.json();
          }

          const projectResponse = await request("");
          const branchResponse = await request("/branches?limit=100");
          const primaryBranches = (branchResponse.branches ?? []).filter((branch) => branch.primary === true);
          if (primaryBranches.length !== 1) throw new Error(`Expected exactly one Neon primary branch; found ${primaryBranches.length}.`);
          const branchId = projectResponse.project?.default_branch_id ?? primaryBranches[0].id;
          if (!branchId) throw new Error("The Neon project has no default branch.");

          const databaseResponse = await request(`/branches/${encodeURIComponent(branchId)}/databases`);
          const databases = databaseResponse.databases ?? [];
          if (databases.length !== 1) throw new Error(`Expected exactly one production database; found ${databases.length}.`);
          const database = databases[0];
          if (!database.name || !database.owner_name) throw new Error("The production database or owner could not be resolved.");

          const query = new URLSearchParams({
            branch_id: branchId,
            database_name: database.name,
            role_name: database.owner_name,
            pooled: "false",
          });
          const connectionResponse = await request(`/connection_uri?${query}`);
          const databaseUrl = connectionResponse.uri ?? connectionResponse.connection_uri;
          if (!databaseUrl) throw new Error("Neon did not return a production connection URI.");

          console.log(`::add-mask::${databaseUrl}`);
          appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL<<VOGNARY_DATABASE_URL\n${databaseUrl}\nVOGNARY_DATABASE_URL\n`);
          console.log("Resolved the default Neon branch and its single production database.");
          NODE

      - name: Inspect the Recovery cutover state
        run: |
          node <<'NODE'
          const { default: pg } = await import("pg");
          const pool = new pg.Pool({
            connectionString: process.env.DATABASE_URL,
            ssl: { rejectUnauthorized: false },
          });

          try {
            const migrations = await pool.query("select id from schema_migrations order by id");
            const state = await pool.query(`
              select
                (select count(*)::int from workspace_states) as workspace_states,
                (select count(*)::int from recurring_items) as recurring_items,
                (select count(*)::int from evidence_links) as evidence_links,
                (select count(*)::int from commitment_decisions) as commitment_decisions,
                (select count(*)::int from transactions) as transactions,
                (select count(*)::int from data_sources) as data_sources,
                (select count(*)::int from connector_evidence) as connector_evidence,
                (select count(*)::int from connected_accounts
                  where coalesce(metadata ->> 'ledgerAuthority', 'LEGACY') <> 'RECOVERY_V1') as legacy_connected_accounts,
                (select count(*)::int from recovery_workspace_states) as recovery_workspaces,
                (select count(distinct state.workspace_id)::int from workspace_states state) as legacy_workspaces,
                (select count(distinct state.workspace_id)::int
                  from workspace_states state
                  join workspaces workspace on workspace.id = state.workspace_id
                  join auth_identities identity on identity.user_id = workspace.owner_user_id
                  where identity.provider = 'google') as google_linked_legacy_workspaces,
                (select count(distinct state.workspace_id)::int
                  from workspace_states state
                  join workspaces workspace on workspace.id = state.workspace_id
                  join auth_sessions session on session.user_id = workspace.owner_user_id
                  where session.revoked_at is null and session.expires_at > now()) as active_session_legacy_workspaces,
                (select count(distinct state.workspace_id)::int
                  from workspace_states state
                  join workspaces workspace on workspace.id = state.workspace_id
                  join users owner on owner.id = workspace.owner_user_id
                  where owner.deleted_at is not null) as deleted_owner_legacy_workspaces,
                (select coalesce(jsonb_object_agg(summary.frequency, summary.row_count), '{}'::jsonb)
                  from (select frequency, count(*)::int as row_count from recurring_items group by frequency) summary) as legacy_item_frequencies,
                (select coalesce(jsonb_object_agg(summary.kind, summary.row_count), '{}'::jsonb)
                  from (select kind::text, count(*)::int as row_count from data_sources group by kind) summary) as legacy_source_kinds,
                (select count(*)::int from evidence_links
                  where amount is not null and evidence_date is not null and source_id is not null) as complete_legacy_evidence,
                (select count(*)::int from connector_sync_jobs
                  where status in ('queued', 'running', 'failed', 'paused')) as nonterminal_connector_jobs,
                (select count(*)::int from connector_sync_runs where status = 'running') as running_connector_runs,
                (select count(*)::int from renewal_alert_deliveries
                  where recurring_item_id is not null and status in ('scheduled', 'sending', 'failed')) as nonterminal_legacy_reminders
            `);
            console.log(JSON.stringify({
              appliedMigrations: migrations.rows.map((row) => row.id),
              cutoverState: state.rows[0],
            }, null, 2));
          } finally {
            await pool.end();
          }
          NODE

      - name: Validate Phase A migration preconditions
        if: inputs.operation == 'apply-latest'
        run: |
          node <<'NODE'
          const { default: pg } = await import("pg");
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
          try {
            const result = await pool.query(`
              select
                (select id from schema_migrations order by id desc limit 1) as migration_head,
                exists(select 1 from pg_trigger where tgname = 'connector_sync_jobs_recovery_cutover_guard') as connector_job_guard,
                exists(select 1 from pg_trigger where tgname = 'connector_evidence_running_job_guard') as connector_evidence_guard,
                exists(select 1 from pg_trigger where tgname = 'renewal_alert_deliveries_recovery_cutover_guard') as renewal_delivery_guard,
                (select count(*)::int from connector_sync_jobs where status in ('queued', 'running', 'failed', 'paused')) as nonterminal_connector_jobs,
                (select count(*)::int from connector_sync_runs where status = 'running') as running_connector_runs,
                (select count(*)::int from renewal_alert_deliveries where recurring_item_id is not null and status in ('scheduled', 'sending', 'failed')) as nonterminal_legacy_reminders
            `);
            const state = result.rows[0];
            console.log(JSON.stringify(state, null, 2));
            if (state.migration_head !== '0026_recovery_inbound_retention'
              || !state.connector_job_guard
              || !state.connector_evidence_guard
              || !state.renewal_delivery_guard
              || state.nonterminal_connector_jobs !== 0
              || state.running_connector_runs !== 0
              || state.nonterminal_legacy_reminders !== 0) {
              throw new Error("Phase A production migration preconditions failed.");
            }
          } finally {
            await pool.end();
          }
          NODE

      - name: Apply the canonical Phase A migration chain
        if: inputs.operation == 'apply-latest'
        run: npm run db:apply-schema

      - name: Apply bounded Commitment Control migration 0057
        if: inputs.operation == 'apply-control-0057'
        run: npm run db:apply-production-0057 -- --confirm-0056-to-0057-production

      - name: Verify the canonical Phase A migration chain
        if: inputs.operation == 'apply-latest'
        run: |
          node <<'NODE'
          const { default: pg } = await import("pg");
          const pool = new pg.Pool({
            connectionString: process.env.DATABASE_URL,
            ssl: { rejectUnauthorized: false },
          });

          try {
            const result = await pool.query(`
              select
                (select id from schema_migrations order by id desc limit 1) as migration_head,
                exists(select 1 from pg_trigger where tgname = 'connector_sync_jobs_recovery_cutover_guard') as connector_job_guard,
                exists(select 1 from pg_trigger where tgname = 'connector_evidence_running_job_guard') as connector_evidence_guard,
                exists(select 1 from pg_trigger where tgname = 'renewal_alert_deliveries_recovery_cutover_guard') as renewal_delivery_guard,
                exists(select 1 from pg_trigger where tgname = 'recovery_inbound_alias_milestones_immutable') as receipt_milestone_guard,
                (select count(*)::int from connector_sync_jobs
                  where status in ('queued', 'running', 'failed', 'paused')) as nonterminal_connector_jobs,
                (select count(*)::int from connector_sync_runs where status = 'running') as running_connector_runs,
                (select count(*)::int from renewal_alert_deliveries
                  where recurring_item_id is not null and status in ('scheduled', 'sending', 'failed')) as nonterminal_legacy_reminders
            `);
            const verification = result.rows[0];
            console.log(JSON.stringify(verification, null, 2));
            if (verification.migration_head !== '0057_commitment_control_v0'
              || !verification.connector_job_guard
              || !verification.connector_evidence_guard
              || !verification.renewal_delivery_guard
              || !verification.receipt_milestone_guard
              || verification.nonterminal_connector_jobs !== 0
              || verification.running_connector_runs !== 0
              || verification.nonterminal_legacy_reminders !== 0) {
              throw new Error("The canonical Phase A migration verification failed.");
            }
          } finally {
            await pool.end();
          }
          NODE

      - name: Materialize legacy evidence into Recovery and retire duplicate authority
        if: inputs.operation == 'migrate-legacy'
        run: npm run db:migrate-legacy-recovery -- --confirm
