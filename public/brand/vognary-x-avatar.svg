<!-- X profile avatar master. 800 × 800; all critical artwork stays inside the circular crop-safe area. -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Vognary X avatar</title>
  <desc id="desc">The Vognary Ledger to Authorization mark on a graphite field</desc>
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 470) rotate(90) scale(470)">
      <stop stop-color="#171B22"/>
      <stop offset=".58" stop-color="#0B0D11"/>
      <stop offset="1" stop-color="#050609"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 510) rotate(90) scale(230)">
      <stop stop-color="#D8B87A" stop-opacity=".2"/>
      <stop offset="1" stop-color="#D8B87A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="337" stroke="#D8B87A" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="400" cy="400" r="309" stroke="#FFFFFF" stroke-opacity=".045"/>
  <path d="M126 224h548M104 304h592M94 496h612M122 576h556" stroke="#FFFFFF" stroke-opacity=".028"/>
  <circle cx="400" cy="510" r="230" fill="url(#goldGlow)"/>
  <g transform="translate(80 100) scale(10)" filter="url(#softShadow)">
    <path d="M7 11h17l5 7H12l-5-7ZM13 23h15l5 7H18l-5-7Z" fill="#F0F1F5"/>
    <path d="M57 11H40l-5 7h17l5-7ZM51 23H36l-5 7h15l5-7Z" fill="#F0F1F5"/>
    <path d="m20.5 35 11.5 14L43.5 35" stroke="#D8B87A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="m23 35 9 11 9-11" stroke="#F1DCA6" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" opacity=".72"/>
  </g>
</svg>
